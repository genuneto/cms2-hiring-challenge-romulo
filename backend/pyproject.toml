[project]
name = "project-editor-backend"
version = "0.1.0"
description = "Backend-for-frontend in front of the upstream records API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
backend = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration tests run our backend against the real upstream app, in process.
# Upstream is imported straight from its folder; it is never copied or modified.
pythonpath = [".", "../upstream"]
